name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
      - run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run --reporter=verbose
      - name: Coverage check (≥85% lines)
        run: npx vitest run --coverage
